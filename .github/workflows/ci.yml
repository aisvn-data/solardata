name: CI

# The pipeline's contract is not "the tests pass" but "the tests pass AND the
# build still produces 735,004 readings".  Those are different guarantees: the
# test suite exercises fixtures, and only a real run over the 364-file archive
# can notice that a change quietly stopped ingesting a channel.
on:
  push:
    branches: [main, opencode]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci || npm install

      # The chart and CSV semantics are the part most likely to be quietly
      # wrong: coercing an empty cell to 0, or drawing a line across a gap,
      # both produce a chart that looks fine and reads as data that does not
      # exist. The build alone would not catch either.
      - name: Check the chart helpers and exported data
        run: node scripts/check_frontend.mjs

      - name: Build
        run: npm run build

      - name: Confirm the data files are in the bundle
        # The site fetches these at runtime; if they are missing from dist the
        # deploy succeeds and every page shows an error.
        run: |
          test -f dist/data/stations.json
          test -f dist/data/quality.json
          echo "csv files in dist: $(find dist/data -name '*.csv' | wc -l)"

  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check etl tests scripts

      - name: Ruff format
        run: ruff format --check etl tests scripts

      # Catches the "Invalid workflow file" class of error before it reaches
      # Actions: yaml.safe_load only checks syntax, not the Actions schema, so a
      # misplaced key like a workflow-level `environment` parses cleanly and is
      # then rejected at runtime.
      - name: Pytest
        run: pytest tests

  build:
    name: Full build and baseline
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    # The ingest opens 364 XLSX files: ~3 min locally, so allow real headroom
    # rather than risk a flaky timeout on a loaded runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot the committed Parquet
        # The build overwrites data/processed/parquet, so the committed layout
        # has to be recorded before it runs -- otherwise there is nothing left
        # to compare against and a stale published artefact goes unnoticed.
        run: |
          python scripts/parquet_manifest.py write data/processed/parquet \
            --output "${RUNNER_TEMP}/parquet_before.json"

      - name: Build everything
        run: python -m etl all --quiet

      # The guard. Any drift in the reading count, the duplicate accounting, the
      # note count, or -- most importantly -- a headerless file that lost its
      # schema donor fails here.
      - name: Verify the build against data/baseline.json
        run: python -m etl verify

      - name: Check the committed Parquet is not stale
        run: |
          python scripts/parquet_manifest.py check data/processed/parquet \
            --against "${RUNNER_TEMP}/parquet_before.json"

      - name: Check the regenerated report matches the committed one
        # The report is committed so it can be read in a pull request. If a
        # pipeline change moves the data, the report is the diff a reviewer
        # needs to see -- so a mismatch here should be noticed, not ignored.
        run: |
          if ! git diff --quiet -- data/processed/quality_report.md; then
            echo "::warning::data/processed/quality_report.md changed after rebuild"
            echo "::warning::If the data change is intended, commit the regenerated report."
            git --no-pager diff -- data/processed/quality_report.md | head -60
          fi

      - name: Check the regenerated site data matches the committed one
        # public/data/ is what the deployed site fetches, and the build
        # overwrites it. Same reasoning as the report check above: if the rollups
        # moved, the committed copy has to move with them.
        run: |
          if ! git diff --quiet -- public/data; then
            echo "::warning::public/data changed after rebuild"
            echo "::warning::Commit the regenerated files, or the site will show stale values."
            git --no-pager diff --stat -- public/data | tail -20
          fi

      - name: Summarise
        if: always()
        run: |
          cat > "$RUNNER_TEMP/summary.md" <<'PY'
          import sqlite3
          c = sqlite3.connect("data/processed/solardata.db")
          rows = (
              ("readings", "SELECT COUNT(*) FROM readings"),
              ("source files", "SELECT COUNT(*) FROM source_files"),
              ("stations", "SELECT COUNT(*) FROM stations"),
              ("duplicate timestamps absorbed",
               "SELECT COUNT(*) FROM rejects WHERE reason='duplicate_ts'"),
              ("malformed cells rejected",
               "SELECT COUNT(*) FROM rejects WHERE reason<>'duplicate_ts'"),
              ("notes recovered", "SELECT COUNT(*) FROM notes"),
              ("unconfirmed regimes", "SELECT COUNT(*) FROM regimes WHERE status='unconfirmed'"),
          )
          print("| metric | value |")
          print("|---|---:|")
          for label, sql in rows:
              print(f"| {label} | {c.execute(sql).fetchone()[0]:,} |")
          PY
          {
            echo "## Build result"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the quality report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report
          path: |
            data/processed/quality_report.md
            data/processed/quality_report.json
          if-no-files-found: warn
