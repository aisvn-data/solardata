name: CI

# The pipeline's contract is not "the tests pass" but "the tests pass AND the
# build still produces 731,885 readings".  Those are different guarantees: the
# test suite exercises fixtures, and only a real run over the 364-file archive
# can notice that a change quietly stopped ingesting a channel -- or that a band
# has started firing on a third of a record, which is what 0.8 did to
# phumy2.current2_a and what no unit test could see.
on:
  push:
    branches: [main, opencode]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci || npm install

      # The chart and CSV semantics are the part most likely to be quietly
      # wrong: coercing an empty cell to 0, or drawing a line across a gap,
      # both produce a chart that looks fine and reads as data that does not
      # exist. The build alone would not catch either.
      - name: Check the chart helpers and exported data
        run: node scripts/check_frontend.mjs

      # A prop that disagrees with its call site is invisible to every other
      # check here, and the symptom is a white page rather than a failed
      # assertion: `check_frontend` exercises the pure helpers in src/data.js and
      # the CSV files, and `vite build` cannot check a prop name because the
      # project is plain JSX with no types. This has shipped three times -- a
      # picker where every control was disabled, then `metrics` -> `channels`
      # renamed on one side of a prop boundary only, and then a merge that
      # reintroduced the second. So the tree is rendered.
      - name: Render the component tree
        run: npm run check:render

      - name: Build
        run: npm run build

      - name: Confirm the data files are in the bundle
        # The site fetches these at runtime; if they are missing from dist the
        # deploy succeeds and every page shows an error.
        run: |
          test -f dist/data/stations.json
          test -f dist/data/quality.json
          echo "csv files in dist: $(find dist/data -name '*.csv' | wc -l)"

  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check etl tests scripts

      - name: Ruff format
        run: ruff format --check etl tests scripts

      # Catches the "Invalid workflow file" class of error before it reaches
      # Actions: yaml.safe_load only checks syntax, not the Actions schema, so a
      # misplaced key like a workflow-level `environment` parses cleanly and is
      # then rejected at runtime.
      # The suite is 159 tests over real XLSX fixtures and finishes in a couple of
      # seconds. 0.8 had 147 and one of them read all 364 raw files, which took
      # about fifty seconds and stalled the run: the checks that need the archive
      # live in etl/audit.py and run in data.yml, where a minute of reading is
      # a minute of CI rather than a test suite you stop waiting for.
      - name: Pytest
        run: pytest tests
