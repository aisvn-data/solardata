# solardata -- release the queryable database.
#
# data/processed/solardata.db is about 85 MiB after VACUUM (104 MiB as the ingest
# leaves it), over GitHub's 100 MiB per-file limit for a git blob, so it cannot be
# committed. It ships here as a Release asset instead.
#
# It is smaller than 0.8's 166 MiB for one reason: there are eight station tables
# with the columns each station actually has, rather than one 32-column table of
# which 75% of every row is NULL. WITHOUT ROWID on a TEXT instant does the rest.
#
# `public/data/` (3.3 MiB) IS committed, so the rollups the site fetches are
# available to anyone who clones without running anything. This workflow exists
# for the case where you want the SQLite file.
#
# Trigger: push a `v*` tag. Or run manually and name a tag to publish under.
# The build always runs against the commit that triggered it -- the tag is only
# where the assets are *attached*, never what gets checked out. Checking out a
# named ref here is what made the previous version fail when the tag did not
# exist yet: actions/checkout fell back to treating it as a branch pattern.
#
# The release notes are **generated from CHANGELOG.md**, not written here. They
# used to be a fixed heredoc, which meant every release carried the same two
# sentences and no record of what the release actually changed -- v0.7.1 shipped
# with notes that never mentioned the white page it fixed. The changelog is
# already the repository's record of what changed and why, in the Keep a Changelog
# format, and the tag is its primary key: a section per version, extracted by the
# step below. `CHANGELOG_ONLY` is for the case where a tag has no section yet.
#
# Why a pull request never triggers this, and should not
# -----------------------------------------------------
# A release is cut by a **tag push**, or by hand from the Actions tab. Three
# consequences, all of which have bitten this project at least once:
#
# 1. `pull_request` is deliberately absent. A release publishes a database and
#    attaches assets; running one per pull request would put a 19 MiB upload and
#    a three-minute build on every review push, and the release would describe
#    work nobody merged. Opening a PR does not and will not run this.
# 2. A **manual** run needs the workflow file to be on the *default branch* of
#    the repository. GitHub only offers the "Run workflow" button for workflows
#    it can find there, so a workflow that exists only on a feature branch is
#    invisible in the tab however correct it is. This file has to be merged to
#    the default branch before a manual run is possible.
# 3. A **tag push** runs the workflow as it exists at the tagged commit, in
#    whichever repository the tag is pushed to. Push the tag to a repository
#    whose copy of this file is the old one and the old behaviour runs; push it
#    to the wrong repository and the release lands there.
#
# The project is moving from `kreier/solardata` to `aisvn-data/solardata`. Both
# carry this file and both may cut a release, so the repository guard accepts a
# *list* and defaults to the two of them: a manual run works in either repository
# with nothing typed, and a run in some third repository still fails. Pass `*` to
# switch the check off, and `docs/roadmap.md` carries the migration.
#
# A manual run is refused on any branch but `main`
# ------------------------------------------------
# `workflow_dispatch` runs against whichever ref is selected in the Actions tab,
# so without a check a mistyped branch publishes a database built from work that
# was never merged -- under a tag, because `gh release create` would create it.
# The `guard` job refuses that before anything is built or uploaded. A tag push is
# unaffected: there the ref is the tag, which is the whole point of the trigger.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the assets to (created if it does not exist)
        required: true
        type: string
      changelog_only:
        description: Fail instead of falling back to generated notes, if the changelog has no section for the tag
        required: false
        default: false
        type: boolean
      expected_repository:
        description: >-
          Comma-separated allowlist of repositories this may release into.
          Defaults to the project's own two; pass * to disable the check.
        required: false
        default: "aisvn-data/solardata,kreier/solardata"
        type: string

permissions:
  contents: write

jobs:
  # First, cheap, and before anything is built. A wrong branch or a wrong
  # repository should cost a second and a clear message, not three minutes of
  # ingest and a 19 MiB upload that then has to be taken back down.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a manual run from a branch that is not main
        env:
          # Deliberately *not* `${{ inputs.expected_repository || '...' }}`. On a
          # `push` every `inputs.*` is empty, so a fallback written in the
          # expression is the only thing standing between a tag release and no
          # repository check at all -- and it is one dropped token away. The
          # default lives in the script instead, where the empty case is handled
          # explicitly. `tests/test_workflows.py` asserts the two agree, so the
          # duplication cannot drift.
          EXPECTED: ${{ inputs.expected_repository }}
        run: |
          set -euo pipefail
          echo "event:  $GITHUB_EVENT_NAME"
          echo "ref:    $GITHUB_REF"
          echo "repo:   $GITHUB_REPOSITORY"

          # A manual run may be dispatched from any ref, and the release would
          # then be built from a branch nobody merged and published under a tag.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::refusing to release from ${GITHUB_REF}"
            echo "A manual run must be dispatched from main. Select 'main' in the Actions"
            echo "tab's branch picker and run it again."
            exit 1
          fi

          # Empty means "the project's own repositories", never "no check". A
          # missing value is what a tag push looks like, and reading it as a
          # disabled guard would make every tag release land anywhere. Turning
          # the check off takes a deliberate `*`.
          ALLOWED_DEFAULT="aisvn-data/solardata,kreier/solardata"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="$ALLOWED_DEFAULT"
            echo "note: expected_repository was empty; defaulting to $ALLOWED_DEFAULT"
          fi
          echo "allowed: $EXPECTED"

          if [ "$EXPECTED" = "*" ]; then
            echo "repository check disabled by request; releasing into $GITHUB_REPOSITORY"
            exit 0
          fi

          # A comma-separated allowlist, trimmed, so the input can be either
          # repository without being edited per repository. An exact match only:
          # a prefix or substring test would accept solardata-fork.
          ok=0
          IFS=',' read -ra wanted <<< "$EXPECTED"
          for repo in "${wanted[@]}"; do
            if [ "$(echo "$repo" | tr -d '[:space:]')" = "$GITHUB_REPOSITORY" ]; then
              ok=1
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::refusing to release into ${GITHUB_REPOSITORY}"
            echo "Allowed: ${EXPECTED//,/, }"
            echo "The project is moving from kreier/solardata to aisvn-data/solardata, and"
            echo "a release in the wrong repository publishes a database nobody reads."
            exit 1
          fi

  build-and-attach:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No `ref:` here on purpose -- checkout uses the triggering commit, which
      # is the tag on a tag push and main on a manual run, the `guard` job having
      # established that it is main.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every stage the baseline depends on has to run before `verify`, and the
      # set is not obvious: `ingest` rebuilds the database but does NOT populate
      # the rollups or the per-station channel measurements -- those are a
      # separate stage. Skipping them left the tables empty and the guard
      # correctly reported a drift. The report is in the same list because it is
      # uploaded as a release asset and must be regenerated, not copied from the
      # commit.
      - name: Build the database
        # `etl all` rather than a hand-written stage list, because the list is
        # where a stage gets forgotten: a release once shipped with empty regime
        # tables because the stage that fills them was not in the list, and
        # `verify` correctly reported `unconfirmed_regimes: 14 -> 0`.
        # `tests/test_guards.py` asserts that any workflow calling `verify` runs
        # every stage the baseline depends on.
        run: python -m etl all

      # Never publish a database that does not match the recorded baseline. An
      # asset named solardata.db that quietly lost 90% of its measurements
      # would be worse than no asset at all. This is a real guard, not a
      # formality: it is what caught the missing stage above.
      - name: Verify against the baseline
        run: python -m etl verify

      # A release is three facts that have to agree: the version, the code that
      # declares it, and the notes describing it. `package.json` is canonical --
      # it is the one the frontend build already reads, so it cannot be the one
      # that was forgotten -- and this step refuses to publish if `etl/__init__.py`
      # or `pyproject.toml` disagree, or if the changelog has no section for it.
      #
      # This runs before the 19 MiB upload rather than inside the notes step, so a
      # version bump that forgot the changelog fails in two seconds.
      - name: The version and its release notes agree
        run: python scripts/release_notes.py --check

      - name: Package
        run: |
          # VACUUM rewrites the file without the free pages left by the build,
          # which typically saves 10-20 MiB on a Release upload.
          python -c "
          import sqlite3
          c = sqlite3.connect('data/processed/solardata.db')
          c.execute('VACUUM')
          c.close()
          print('vacuumed')
          "
          gzip -9 -k -f data/processed/solardata.db
          ls -lh data/processed/solardata.db data/processed/solardata.db.gz

      - name: Resolve the release tag
        id: release
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "Publishing under tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The repository and branch guards live in the `guard` job, which runs first
      # and fails in seconds. Leaving a copy here would be a second place for the
      # rule to be edited, and this one ran after the ingest.
      #
      # Uses the `gh` CLI that ships with the runner rather than a third-party
      # action. `softprops/action-gh-release@v2` still runs on the Node 20
      # runtime, which is what produced the deprecation warning; this removes the
      # dependency and the warning together.
      #
      # Four things this gets right that the previous version did not:
      #
      #   * `--target "${GITHUB_SHA}"`. `gh release create` creates the tag at the
      #     *default branch's* HEAD when the tag does not exist, so a manual run
      #     could publish a database built from one commit under a tag pointing at
      #     another. On a tag push the tag already exists and this is a no-op.
      #   * The notes come from the changelog section for this tag, so a release
      #     says what it changed.
      #   * `gh release edit` on a re-run, because `upload --clobber` replaces the
      #     assets and leaves the notes as they were. A re-run used to be
      #     incapable of updating anything but the binaries.
      #   * The asset sizes are measured, not asserted in a comment that drifts.
      - name: Attach to the release

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          # Set CHANGELOG_ONLY=1 to publish the section as it stands instead of
          # falling back to GitHub's generated notes. Off by default: a version
          # with no changelog section is a gap, and generated notes are better
          # than an empty release.
          CHANGELOG_ONLY: ${{ inputs.changelog_only || false }}
        run: |
          set -euo pipefail

          # Measured, so the release page cannot claim a size the asset does not
          # have (which is what it claimed from 0.6.0 to 0.7.2). The reading count
          # is a sum over the eight station tables, because there is no longer one
          # readings table to COUNT(*).
          metrics=$(python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("file:data/processed/solardata.db?mode=ro", uri=True)
          readings = conn.execute(
              "SELECT COALESCE(SUM(n_readings), 0) FROM stations"
          ).fetchone()[0]
          tables = conn.execute(
              "SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name LIKE 's!_%' ESCAPE '!'"
          ).fetchone()[0]
          conn.close()
          print(f"{readings} {tables}")
          PY
          )
          rows=$(echo "$metrics" | cut -d' ' -f1)
          tables=$(echo "$metrics" | cut -d' ' -f2)
          echo "assets: ${rows} readings across ${tables} station tables"
          ls -lh data/processed/solardata.db.gz

          # The changelog section for this tag: everything under `## [<version>]`
          # up to the next `## [`.
          #
          # Extracted by `scripts/release_notes.py`, which is also what decides
          # whether the three places that repeat a version agree -- and is the only
          # implementation of "which section belongs to this tag". The inline awk
          # this replaces matched the tag as given, and the tag carries a `v` that
          # the changelog heading does not, so it would silently find nothing and
          # fall through to generated notes for a release that did have notes.
          #
          # The script takes the notes verbatim. A release note a script assembled
          # is a release note that drifts from the changelog.
          version="${TAG#v}"
          python scripts/release_notes.py --version "$version" \
            > "$RUNNER_TEMP/changelog.md" 2> "$RUNNER_TEMP/changelog.err" || true
          if [ -s "$RUNNER_TEMP/changelog.err" ]; then
            while read -r line; do
              echo "::warning::$line"
            done < "$RUNNER_TEMP/changelog.err"
          fi
          {
            echo "## solardata $TAG"
            echo
            # Which repository this is, in the notes. A release in the wrong repo
            # is otherwise invisible from here, and the two repositories are about
            # to be the same project.
            echo "Published from \`${GITHUB_REPOSITORY}\` at \`${GITHUB_SHA:0:7}\`."
            echo
            echo "\`solardata.db.gz\` is the canonical SQLite store for this tag:"
            echo "${rows} readings. Unpack and query it with:"
            echo
            echo '```'
            echo 'gunzip solardata.db.gz'
            echo "python -m etl --out-dir <dir containing solardata.db> query \\"
            echo '  "SELECT station_id, table_name, n_readings FROM stations"'
            echo '```'
            echo
            echo "Each station is its own table, holding only the channels that station"
            echo "collects, in the unit that channel is published in. \`public/data/\`"
            echo "carries the same declaration per station, and \`etl/catalog.py\` is where"
            echo "it is written down."
            echo
            if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              echo "---"
              echo
              cat "$RUNNER_TEMP/changelog.md"
            elif [ "$CHANGELOG_ONLY" = "true" ]; then
              echo "::error::no CHANGELOG.md section for $TAG, and CHANGELOG_ONLY is set"
              exit 1
            else
              echo "_No CHANGELOG.md section for $TAG; the list below is generated from the commit and pull request history._"
              echo
              echo "## What's Changed"
              gh pr list --state merged --limit 20 --json title,url \
                --jq '.[] | "* \(.title) in \(.url)"' || true
            fi
          } > "$RUNNER_TEMP/notes.md"

          head -3 "$RUNNER_TEMP/notes.md"

          files=(
            data/processed/solardata.db.gz
            data/processed/quality_report.md
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "missing asset: $f" >&2; exit 1; }
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the assets and the notes."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "solardata $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "solardata $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${files[@]}"
          fi
          gh release view "$TAG" --json url --jq .url
