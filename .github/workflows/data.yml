# Rebuild the data store and enforce the baseline.
#
# Split out of `ci.yml` and path-gated, because the two halves have different
# costs and different inputs:
#
#   * `ci.yml` -- lint, unit tests, frontend checks. Runs on every push and pull
#     request, takes about a minute, and is the required check.
#   * this -- a full run over all 364 raw XLSX files. Only runs when something it
#     actually reads has changed, plus a weekly sweep and on demand.
#   * `data_fresh.yml` -- the same build, but deleting the database first and on
#     demand only. See that file for when to reach for it rather than this one.
#
# The gate is the point: a pull request that only touches `src/` cannot change
# the data, because the data comes from `data/raw` through `etl/`. Rebuilding it
# for such a change proves nothing and costs minutes of CI.
#
# Deliberately NOT a required status check. A path-gated workflow produces no
# run at all when the paths do not match, and a required check that never
# appears leaves a pull request waiting for a status that will never arrive.
name: data

on:
  push:
    branches: [main, opencode]
    paths: &data_paths
      - "data/raw/**"
      - "data/baseline.json"
      - "etl/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/data.yml"
      - ".github/workflows/data_fresh.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths: *data_paths
  # Weekly, so a change that slipped past the filter is still caught. 03:17 UTC
  # is an off-peak minute and avoids the top-of-hour rush on GitHub's scheduler.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Full build and baseline
    runs-on: ubuntu-latest
    # ~2 min: the ingest of 364 files is the slow part, plus the aggregate, the
    # export, the report, and the audit's own second pass over the archive.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # `etl all` is ingest, aggregate, export, report and audit, in that order.
      #
      # The audit is not decorative. It is the only stage that reads the raw
      # archive rather than the database the other stages produced, and it is
      # what checks that every (station, width) in those 364 files resolves to a
      # declared layout -- that a headerless file cannot silently lose its column
      # meanings, which is the failure 0.8 could produce and could not detect.
      #
      # The order matters: `aggregate` reads the station tables the ingest wrote,
      # and `verify` measures the rollup bucket counts, so anything that skips a
      # stage compares a partial build against a full baseline.
      - name: Build everything
        run: python -m etl all

      # The guard. Any drift in the reading count, the duplicate accounting, the
      # note count, or a raw file that resolved to no declared layout fails here.
      - name: Verify the build against data/baseline.json
        run: python -m etl verify

      - name: Check the regenerated report matches the committed one
        # The report is committed so it can be read in a pull request. If a
        # pipeline change moves the data, the report is the diff a reviewer
        # needs to see -- so a mismatch here should be noticed, not ignored.
        # It is organised per station, so a diff reads as "this station's battery
        # band moved" rather than as a column in a matrix.
        run: |
          if ! git diff --quiet -- data/processed/quality_report.md; then
            echo "::warning::data/processed/quality_report.md changed after rebuild"
            echo "::warning::If the data change is intended, commit the regenerated report."
            git --no-pager diff -- data/processed/quality_report.md | head -80
          fi

      - name: Check the regenerated site data matches the committed one
        # public/data/ is what the deployed site fetches, and the build
        # overwrites it. Same reasoning as the report check above: if the rollups
        # moved, the committed copy has to move with them.
        run: |
          if ! git diff --quiet -- public/data; then
            echo "::warning::public/data changed after rebuild"
            echo "::warning::Commit the regenerated files, or the site will show stale values."
            git --no-pager diff --stat -- public/data | tail -20
          fi

      - name: Summarise
        if: always()
        run: |
          cat > "$RUNNER_TEMP/summary.md" <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path("data/processed/solardata.db")
          if not db.exists():
              print("_the build did not produce a database_")
              raise SystemExit(0)

          conn = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          conn.row_factory = sqlite3.Row

          def one(sql):
              return conn.execute(sql).fetchone()[0]

          print("| metric | value |")
          print("|---|---:|")
          print(f"| readings | {one('SELECT COALESCE(SUM(n_readings), 0) FROM stations'):,} |")
          print(f"| raw files | {one('SELECT COUNT(*) FROM source_files'):,} |")
          print(f"| stations | {one('SELECT COUNT(*) FROM stations')} |")
          print(f"| hourly buckets | {one('SELECT COUNT(*) FROM readings_hourly'):,} |")
          print(f"| daily buckets | {one('SELECT COUNT(*) FROM readings_daily'):,} |")
          # The number 0.9 exists for. 0.8 flagged 631,252 readings out of range,
          # almost all of it a band applied to the wrong unit -- 416,088 of them
          # because a quarter-of-an-amp current sensor was tested against a
          # +/-50 A band. If this moves, a unit or a band moved.
          print(f"| **out-of-range channel values** | **{one('SELECT COALESCE(SUM(n_out_of_range), 0) FROM channel_stats'):,}** |")
          duplicates = one("SELECT COUNT(*) FROM rejects WHERE reason = 'duplicate_ts'")
          print(f"| duplicate timestamps absorbed | {duplicates:,} |")
          print(f"| rejected cells | {one('SELECT COUNT(*) FROM rejects'):,} |")
          print(f"| notes recovered | {one('SELECT COUNT(*) FROM notes')} |")
          conn.close()

          print()
          print("| station | table | readings | coverage (UTC) |")
          print("|---|---|---:|---|")

          report = Path("data/processed/quality_report.json")
          if report.exists():
              data = json.loads(report.read_text(encoding="utf-8"))
              for station in data.get("stations", []):
                  first = (station.get("first_ts_utc") or "")[:10]
                  last = (station.get("last_ts_utc") or "")[:10]
                  print(
                      f"| {station['station_id']} | `{station['table']}` | "
                      f"{station.get('n_readings') or 0:,} | {first} to {last} |"
                  )
              audit = data.get("band_audit", {})
              unjustified = audit.get("unjustified", [])
              print()
              if unjustified:
                  print(f"**{len(unjustified)} band(s) fire above the threshold with no note.**")
              else:
                  threshold = audit.get("threshold", 0.01)
                  print(
                      f"Band audit: {len(audit.get('rows', []))} banded channels, none above "
                      f"{threshold:.0%} of their own record without a note explaining why."
                  )
          PY
          {
            echo "## Build result"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the quality report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-report
          path: |
            data/processed/quality_report.md
            data/processed/quality_report.json
          if-no-files-found: warn
