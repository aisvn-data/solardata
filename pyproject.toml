[project]
name = "solardata-etl"
version = "0.13.0"
description = "Convert the raw IFTTT/Google-Sheets solar archive into a queryable store"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# openpyxl is the only hard requirement: the ingest reads Google Sheets XLSX
# exports and writes SQLite, which is in the standard library.
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Everything needed to run the tests.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
solardata-etl = "etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `etl.normalize` is gone in 0.9. The per-channel bands, units and scale factors
# that lived there are now declarations in `etl.catalog`, one per
# (station, channel), because a band is a claim about a sensor at a site and a
# column name cannot carry that.
packages = ["etl", "etl.readers"]

[tool.setuptools.package-data]
etl = ["schema.sql"]

# ---------------------------------------------------------------- tool config

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers so an unregistered marker is an error rather than a typo that
# silently does nothing.
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["etl", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
    "RUF001", # ambiguous unicode in strings: the archive has German notes
]

[tool.ruff.lint.per-file-ignores]
# Tests build fixtures inline and use asserts liberally.
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
